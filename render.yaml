# Полная версия с сервером на Render: render.com → New → Blueprint → этот репозиторий.
# Публичный адрес сервер берёт из RENDER_EXTERNAL_URL, который Render задаёт сам.
services:
  - type: web
    name: pozovi
    runtime: node
    plan: free
    buildCommand: "true"
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
